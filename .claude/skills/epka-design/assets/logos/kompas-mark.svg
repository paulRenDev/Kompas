    <circle cx="20" cy="20" r="17.5"/>
    <path d="M20 2.5v4.2M20 33.3v4.2M2.5 20h4.2M33.3 20h4.2"/>
  </g>
  <line x1="13.2" y1="26.8" x2="27.4" y2="12.6" stroke="#FC4C50" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="13.2" cy="26.8" r="5" fill="#FC4C50"/>
  <circle cx="27.4" cy="12.6" r="3.2" fill="#FC4C50"/>
  <circle cx="20.3" cy="19.7" r="2.1" fill="#0B2B36"/>
</svg>
