<!DOCTYPE html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="styles.css"/>
<style>*{margin:0;box-sizing:border-box}body{width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:100%;height:100%}
.main{flex:1;background:var(--epka-ink);display:flex;align-items:center;justify-content:center}
.main img{width:60%;max-width:620px;object-fit:contain}
.strip{width:110px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body>
<div class="wrap">
  <div class="main"><img src="assets/logos/epka-wordmark-white.png" alt="EPKA"/></div>
  <div class="strip">
    <div style="background:var(--epka-gold)"></div>
    <div style="background:var(--epka-teal)"></div>
    <div style="background:var(--epka-coral)"></div>
    <div style="background:var(--epka-ink)"></div>
  </div>
</div>
</body></html>
